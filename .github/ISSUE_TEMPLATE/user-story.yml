name: User Story
description: Create a user story with clear acceptance criteria
title: "Story: "
labels: ["user-story"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile (Expo)
        - API (Spring Boot)
        - Mobile + API
        - CI / DevOps
        - Docs
        - Other
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Epic link (optional)
      description: Link the parent epic issue if applicable.
      placeholder: "#123"
    validations:
      required: false

  - type: textarea
    id: story
    attributes:
      label: User story
      description: "As a [user], I want to [functionality], so that [benefit]."
      placeholder: "As a ..., I want to ..., so that ..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: Background, constraints, or useful links.
      placeholder: Links, screenshots, API contracts, etc.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: "Crystal clear, testable criteria (bullets)."
      placeholder: "- Given ... when ... then ..."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 (Must)
        - P1 (Should)
        - P2 (Could)
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimate (story points)
      placeholder: "e.g., 1, 2, 3, 5, 8"
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers (optional)
      placeholder: |
        - Depends on #...
        - Blocked by ...
    validations:
      required: false

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of done (optional)
      options:
        - label: Acceptance criteria are met
          required: false
        - label: Tests updated/added where appropriate
          required: false
        - label: Docs updated if needed
          required: false
