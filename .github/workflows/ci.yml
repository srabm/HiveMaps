name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  MOBILE_DIR: hive-maps/apps/mobile

jobs:
  # Detect changed areas so we can skip unrelated jobs.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      api: ${{ steps.filter.outputs.api }}
      ci: ${{ steps.filter.outputs.ci }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'hive-maps/apps/mobile/**'
            api:
              - 'hive-maps/services/api/**'
            ci:
              - '.github/workflows/**'

  # Mobile static checks + unit tests
  mobile-unit:
    name: Mobile Unit (TypeScript + Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.ci == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: ${{ env.MOBILE_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci

      - name: Type check
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run typecheck

      - name: Unit tests
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run test:ci
      
      - name: Upload Mobile coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ env.MOBILE_DIR }}/coverage
          flags: mobile
          fail_ci_if_error: false

      - name: Upload mobile coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: ${{ env.MOBILE_DIR }}/coverage
          if-no-files-found: ignore

  # Backend unit tests
  api-unit:
    name: API Unit (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true' }}
    defaults:
      run:
        working-directory: hive-maps/services/api
    env: 
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: bash ./gradlew --no-daemon clean test jacocoTestReport

      - name: Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            hive-maps/services/api/build/reports/tests/test
            hive-maps/services/api/build/reports/jacoco/test
          if-no-files-found: ignore

      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: hive-maps/services/api/build/reports/jacoco/test
          flags: api
          fail_ci_if_error: false

  # Backend docker-compose reachability check
  api-compose-smoke:
    name: API Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true' }}
    defaults:
      run:
        working-directory: hive-maps/services/api
    env: 
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start API stack (build + run)
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/api/hello >/dev/null; then
              echo "API is ready."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time."
          exit 1

      - name: Verify hello endpoint
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/hello >/dev/null

      - name: API container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Stop API stack and clean volumes
        if: always()
        run: docker compose down -v
