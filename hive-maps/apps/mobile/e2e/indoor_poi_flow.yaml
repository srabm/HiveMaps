appId: com.anonymous.mobile
---
- tapOn: "Search building or address"
- inputText: "Hall Building"
- tapOn: "Concordia University, Henry F. Hall (H) Building"

- tapOn:
    point: 50%,54%

- tapOn: "Indoor"

- extendedWaitUntil:
    visible:
      id: "poi-icon-elevator"
    timeout: 10000

- assertVisible:
    id: "poi-icon-elevator"
- assertVisible:
    id: "poi-icon-escalator"
- assertVisible: "To room (e.g. H8.841)"

- tapOn:
    id: "clear-from"
- assertVisible: "From room (e.g. H8.835)"

- tapOn:
    id: "poi-icon-elevator"
- assertNotVisible:
    id: "indoor-poi-quick-actions"
- extendedWaitUntil:
    notVisible: "To room (e.g. H8.841)"
    timeout: 5000

- runFlow:
    when:
      visible: "Elevator"
    commands:
      - assertVisible: "Elevator"

- waitForAnimationToEnd:
    timeout: 1200

- runFlow:
    when:
      visible: "✕"
    commands:
      - tapOn: "✕"
      - extendedWaitUntil:
          visible: "To room (e.g. H8.841)"
          timeout: 5000

- tapOn:
    id: "poi-icon-escalator"
- assertNotVisible:
    id: "indoor-poi-quick-actions"
- extendedWaitUntil:
    visible: "Escalator"
    timeout: 5000
- assertNotVisible: "Elevator"
    
- swipe:
    start: 50%, 50%
    end: 50%, 50%
    duration: 5000
- stopApp
