appId: com.anonymous.mobile
---
- tapOn: "Search building or address"
- inputText: "Hall Building"
- tapOn: "Concordia University, Henry F. Hall (H) Building"

- tapOn:
    point: 50%,54%

- tapOn: "Indoor"

- extendedWaitUntil:
    visible:
      id: "floor-chip-9"
    timeout: 10000

- tapOn:
    id: "floor-chip-9"
- extendedWaitUntil:
    visible:
      id: "floor-chip-9-active"
    timeout: 5000

- assertVisible:
    id: "indoor-poi-marker-H-9-ELEVATOR-001"
- assertVisible: "To room (e.g. H8.841)"

- swipe:
    start: 62%, 62%
    end: 48%, 48%
    duration: 700
- swipe:
    start: 48%, 48%
    end: 62%, 62%
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "indoor-poi-marker-H-9-ELEVATOR-001"
- assertNotVisible:
    id: "indoor-poi-quick-actions"
- extendedWaitUntil:
    notVisible: "To room (e.g. H8.841)"
    timeout: 10000

- runFlow:
    when:
      visible: "Walk"
    commands:
      - assertVisible: "Walk"

- waitForAnimationToEnd:
    timeout: 1200

- extendedWaitUntil:
    visible: " Start"
    timeout: 10000
- tapOn: " Start"
- extendedWaitUntil:
    visible: "Next"
    timeout: 8000

- repeat:
    while:
      visible: "Next"
    commands:
      - tapOn: "Next"
      - waitForAnimationToEnd:
          timeout: 500

- runFlow:
    when:
      visible: "Arrived"
    commands:
      - assertVisible: "Arrived"

- swipe:
    start: 50%, 50%
    end: 50%, 50%
    duration: 5000
- stopApp
